# ═══════════════════════════════════════════════════════════════════════
#  DTM Drainage AI  –  Master Configuration
#  MoPR Geospatial Intelligence Hackathon
# ═══════════════════════════════════════════════════════════════════════

project:
  name: "DTM-Drainage-AI"
  version: "1.0.0"
  crs: "EPSG:32643"           # UTM Zone 43N – matches Gujarat input data

# ── Data Paths ──────────────────────────────────────────────────────────
data:
  input_dir: "data/input"
  output_dir: "data/output"
  cache_dir: "data/cache"
  villages:
    # ── Validated & processed (4 SVAMITVA villages, Gujarat + Punjab) ──────────
    - name: "DEVDI"
      path: "data/input/DEVDI_511671.las"
      output_subdir: "DEVDI"
    - name: "KHAPRETA"
      path: "data/input/KHAPRETA_510206.laz"
      output_subdir: "KHAPRETA"
    - name: "DHAL_HOSHIARPUR"
      path: "data/input/Dhal_Hoshiarpur_31235.las"
      output_subdir: "DHAL_HOSHIARPUR"
    - name: "CHAKHIRASINGH"
      path: "data/input/67169_5NKR_CHAKHIRASINGH.las"
      output_subdir: "CHAKHIRASINGH"
    # ── Additional villages (require free disk space ≥40 GB) ───────────────────
    - name: "DHUNDA"
      path: "data/input/DHUNDA_FATEHGARH SAHIB_32619.laz"
      output_subdir: "DHUNDA"
    - name: "REFLIGHT_2H"
      path: "data/input/64334_2H (REFLIGHT)_POINT CLOUD.LAS"
      output_subdir: "REFLIGHT_2H"
    - name: "PIRAYANKUPPAM"           # geographic CRS — auto-reprojected to UTM
      path: "data/input/PIRAYANKUPPAM.las"
      output_subdir: "PIRAYANKUPPAM"
    - name: "THANDALAM"               # geographic CRS — auto-reprojected to UTM
      path: "data/input/THANDALAM.las"
      output_subdir: "THANDALAM"
    - name: "DIGLIPUR"
      path: "data/input/Gandhinagar_Diglipur_group1_densified_point_cloud.laz"
      output_subdir: "DIGLIPUR"
    # KADAMTALA excluded — corrupted LAZ header (claims 1.65B points, fails at point 0)

# ── Preprocessing ────────────────────────────────────────────────────────
preprocessing:
  tile_size: 200              # metres per tile edge (reduced from 500 to fit PDAL RAM)
  tile_buffer: 25             # overlap buffer to avoid edge artefacts

# ── Ground Classification ────────────────────────────────────────────────
ground_classification:
  primary_method: "smrf"      # Simple Morphological Filter (PDAL)
  fallback_method: "csf"      # Cloth Simulation Filter
  smrf:
    slope: 0.15
    window: 18.0
    threshold: 0.5
    scalar: 1.25
    ignore_class_zero: true
  csf:
    resolution: 0.5
    rigidness: 3              # 1=steep, 3=flat terrain (abadi is flat)
    class_threshold: 0.5
    cloth_resolution: 0.5
  ml_refine:
    enabled: true             # Post-process SMRF labels with Random Forest
    features:
      - "eigenvalue_sum"
      - "omnivariance"
      - "eigenentropy"
      - "anisotropy"
      - "planarity"
      - "linearity"
      - "surface_variation"
      - "sphericity"
      - "verticality"
      - "z_range_5m"
      - "density_1m"
    n_estimators: 500
    max_depth: 25
    min_samples_split: 10
    min_samples_leaf: 4
    n_jobs: -1

# ── DTM Generation ──────────────────────────────────────────────────────
dtm:
  resolution: 0.5             # metres per pixel (0.5 m for abadi precision)
  interpolation:
    idw_power: 2
    idw_radius: 5.0           # search radius in metres
  smoothing:
    enabled: true
    method: "gaussian"
    sigma: 1.0
  output_format: "COG"        # Cloud-Optimized GeoTIFF (OGC standard)
  nodata: -9999.0
  compression: "deflate"
  overview_levels: [2, 4, 8, 16]

# ── Terrain Analysis ────────────────────────────────────────────────────
terrain_analysis:
  depression_min_depth: 0.1   # min depression depth (m) to flag

# ── Waterlogging Prediction ─────────────────────────────────────────────
waterlogging:
  model: "xgboost"            # xgboost | random_forest | ensemble
  features:
    - "elevation_normalized"
    - "slope"
    - "aspect"
    - "tpi"                   # Topographic Position Index
    - "twi"                   # Topographic Wetness Index
    - "flow_accumulation_log"
    - "curvature_plan"
    - "curvature_profile"
    - "depression_depth"
    - "distance_to_channel"
  xgboost:
    n_estimators: 1000
    max_depth: 9
    learning_rate: 0.03
    subsample: 0.85
    colsample_bytree: 0.85
    scale_pos_weight: 10      # handle class imbalance (few waterlogging events)
    min_child_weight: 3
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
  threshold: 0.45             # probability threshold for binary classification
  cv_folds: 5

# ── Drainage Network Design ─────────────────────────────────────────────
drainage:
  side_slope: 1.5             # H:V ratio for channel cross-section
  manning_n: 0.025            # Manning's roughness (concrete-lined earthen)
  design_return_period: 10    # years (10-yr storm)
  rainfall_intensity: 50      # mm/hr (design storm – Gujarat region)
  runoff_coefficient: 0.65    # urban village with mixed surfaces
  cost_per_metre_channel: 800 # INR/m (earthen channel estimate)
  cost_per_metre_pipe: 3500   # INR/m (RCC pipe estimate)
  optimization:
    method: "greedy_mst"      # minimum spanning tree on flow graph
    max_iterations: 1000

# ── Output Formats (OGC-compliant) ──────────────────────────────────────
output:
  raster:
    format: "COG"             # Cloud-Optimized GeoTIFF
  vector:
    format: "GPKG"            # GeoPackage (OGC standard)
    filename: "drainage_network.gpkg"
  pointcloud:
    format: "LAS"             # LAS 1.4 (OGC standard)
